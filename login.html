  <script>
    const prefix = "panera-mg/";
    const system = window.matchMedia("(prefers-color-scheme: dark)").matches ?
      "dark" :
      "light";
    const color = localStorage
      .getItem(`${prefix}theme/activeColor`)
      ?.replace(/"/g, "");
    const theme =
      localStorage.getItem(`${prefix}theme/activeTheme`)?.replace(/"/g, "") ||
      system;
    const direction =
      localStorage.getItem(`${prefix}theme/activeDirection`)?.replace(/"/g, "") ||
      "ltr";
    if (color)
      document.documentElement.style.setProperty("--colors-primary", color);
    document.documentElement.classList.remove("light", "dark");
    document.documentElement.classList.add(theme === "system" ? system : theme);
    document.documentElement.setAttribute("dir", direction);

  </script>
